<!doctype html>
<!--
  eyedropper-grade: HyperFrames component (color science / grading tool).
  Simulates a colorist's eyedropper loupe sampling a color point from footage and dynamically shifting the color grade palette.
-->
<html lang="en" data-composition-id="eyedropper-grade" data-composition-duration="3.0">
  <head>
    <meta charset="UTF-8" />
    <title>Eyedropper Grade</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="eyedropper-grade" data-duration="3.0" data-fps="30">
        <style>
          *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
          #root {
            position: relative;
            width: 100%;
            height: 100%;
            background: #171614;
            overflow: hidden;
            font-family: 'Bricolage Grotesque', sans-serif;
            color: #F4F3EF;
            display: flex;
            align-items: center;
            justify-content: center;
          }
          .eg-frame {
            position: relative;
            width: 860px;
            height: 1180px;
            border-radius: 36px;
            overflow: hidden;
            border: 3px solid rgba(255, 214, 107, 0.4);
            box-shadow: 0 40px 100px rgba(0,0,0,0.85);
            background: radial-gradient(circle at 50% 50%, #352e24 0%, #171614 90%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
          }
          .eg-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
          }
          .eg-badge {
            background: #FFD66B;
            color: #171614;
            padding: 10px 24px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
          }
          .eg-swatch {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace;
            font-size: 20px;
          }
          .swatch-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #8b6b3e;
            border: 2px solid #ffffff;
          }
          /* Eyedropper Loupe Magnifier */
          .eg-loupe {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 214, 107, 0.8), 0 20px 50px rgba(0,0,0,0.9);
            background: radial-gradient(circle, #e2bb62 0%, #a17734 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
          }
          .eg-crosshair {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: relative;
          }
          .eg-crosshair::before, .eg-crosshair::after {
            content: '';
            position: absolute;
            background: #ffffff;
          }
          .eg-crosshair::before { top: -14px; left: 8px; width: 2px; height: 10px; }
          .eg-crosshair::after { top: 8px; left: -14px; width: 10px; height: 2px; }
          /* Footer */
          .eg-footer {
            z-index: 10;
          }
          .eg-title {
            font-size: 54px;
            font-weight: 900;
            line-height: 1.05;
          }
          .eg-sub {
            font-size: 26px;
            color: #FFD66B;
            font-weight: 700;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
          }
        </style>

        <div class="eg-frame">
          <div class="eg-top-bar">
            <div class="eg-badge">Color Science Grade</div>
            <div class="eg-swatch">
              <div class="swatch-color" id="eg-swatch-box"></div>
              <span id="eg-hex">#FFD66B</span>
            </div>
          </div>

          <div class="eg-loupe">
            <div class="eg-crosshair"></div>
          </div>

          <div class="eg-footer">
            <h1 class="eg-title">EYEDROPPER GRADE</h1>
            <div class="eg-sub">Spot-Sampled Colorist Tonal Correction</div>
          </div>
        </div>
      </div>
    </template>

    <script>
      (function() {
        const root = document.querySelector("#root");
        if (!root) return;

        const loupe = root.querySelector(".eg-loupe");
        const swatch = root.querySelector("#eg-swatch-box");
        const hex = root.querySelector("#eg-hex");
        const frame = root.querySelector(".eg-frame");

        const tl = gsap.timeline({ paused: true });

        // Loupe glides across subject
        tl.fromTo(frame, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
        tl.fromTo(loupe, 
          { x: -140, y: 120, scale: 0.8 }, 
          { x: 80, y: -60, scale: 1.1, duration: 1.6, ease: "power2.inOut" }, 
          0.3
        );

        // Color sample snapshot
        tl.to(swatch, { backgroundColor: "#FFD66B", duration: 0.2 }, 1.9);
        tl.to(hex, { textContent: "#FFD66B", duration: 0.01 }, 1.9);
        tl.fromTo(frame, 
          { filter: "saturate(0.8) contrast(0.9)" }, 
          { filter: "saturate(1.25) contrast(1.15)", duration: 0.8, ease: "power2.out" }, 
          2.0
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["eyedropper-grade"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
